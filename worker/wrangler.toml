name = "cloudflare_temp_email"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = [ "nodejs_compat" ]
account_id = "6c18d33071f75f4fa94fc308a1fd4bd8"
keep_vars = true

routes = [
	{ pattern = "automation.my.id", custom_domain = true },
]

# Cloudflare Pages / Workers Assets
[assets]
directory = "../frontend/dist/"
binding = "ASSETS"
run_worker_first = true

[vars]
DEFAULT_LANG = "id"
TITLE = "Automation Temp Mail"
PREFIX = "tmp"
DEFAULT_DOMAINS = ["automation.my.id", "jagoseo.web.id", "resepkue.web.id", "resepmakanan.web.id", "sarapanbakery.com", "tawaf.my.id"]
DOMAINS = ["automation.my.id", "jagoseo.web.id", "resepkue.web.id", "resepmakanan.web.id", "sarapanbakery.com", "tawaf.my.id"]
JWT_SECRET = "0b58e2d4f3c1a8e9d0b7f6e5d4c3b2a1" # Generated secret
ENABLE_USER_CREATE_EMAIL = true
ENABLE_USER_DELETE_EMAIL = true
ENABLE_AUTO_REPLY = false
BILLING_ENABLED = true
BILLING_LAUNCH_AT = "2024-01-01"
ADMIN_USER_ROLE = "admin"
USER_DEFAULT_ROLE = "user"
DOMPETX_BASE_URL = "https://api.dompetx.com/v1"
DISABLE_ANONYMOUS_USER_CREATE_EMAIL = true

[[d1_databases]]
binding = "DB"
database_name = "temp_email_db"
database_id = "c9242574-791b-406b-b722-9149546a5d5d"

[[kv_namespaces]]
binding = "KV"
id = "2852a415e0024430ab5df926b560b253"
